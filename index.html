
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Infra Code Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background: #1e1e1e;
            color: white;
            overflow: hidden;
        }

        #editor-container {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #editor {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="editor-container">
        <div id="editor"></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
