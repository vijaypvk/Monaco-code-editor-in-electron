<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jupyter-Like Notebook</title>
    <script> require = { paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } }; </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="renderer.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            padding: 10px;
        }
        .editor {
            height: 150px;
            border: 1px solid #444;
            margin-bottom: 5px;
        }
        .output {
            background: black;
            padding: 5px;
            min-height: 70px;
            margin-top: 10px;
        }
        .cell {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #333;
            background: #2e2e2e;
        }
        button {
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .delete-button {
            background: red;
        }
    </style>
</head>
<body>

    <button onclick="addCodeCell()">➕ Code</button>
    <button onclick="addMarkdownCell()">📄 Markdown</button>
    <button onclick="runAllCells()">▶️ Run All</button>
    <button onclick="saveNotebook()">💾 Save</button>
    <button onclick="loadNotebook()">📂 Load</button>
    <button onclick="toggleTheme()">🎨 Theme</button>

    <div id="notebook"></div>

</body>
</html>
